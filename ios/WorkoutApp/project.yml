name: WorkoutApp
options:
  bundleIdPrefix: com.kellyneil
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  WorkoutEngine:
    path: ../Packages/WorkoutEngine
  WorkoutStore:
    path: ../Packages/WorkoutStore
  WorkoutUI:
    path: ../Packages/WorkoutUI
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    DEVELOPMENT_TEAM: V74SR2AB3N
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  WorkoutApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: WorkoutEngine
      - package: WorkoutStore
      - package: WorkoutUI
    entitlements:
      path: Resources/WorkoutApp.entitlements
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "Neil's Workout"   # App Store rejects "Workout" (90129: name already taken)
        CFBundleName: "Neil's Workout"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true   # portrait-only: opt out of iPad multitasking (App Store check 90474)
        ITSAppUsesNonExemptEncryption: false   # HTTPS only (exempt) — skips the export-compliance prompt on every TestFlight build
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        API_BASE_URL: $(API_BASE_URL)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (spec §1); xcodegen's target default is "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.kellyneil.workout
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Hunny   # Pooh theme icon, applied via AppIconSwitcher
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        API_BASE_URL: https://exercise-app-api.fly.dev
      configs:
        Debug:
          API_BASE_URL: https://exercise-app-api.fly.dev
schemes:
  WorkoutApp:
    build:
      targets: { WorkoutApp: all }
    run:
      config: Debug
