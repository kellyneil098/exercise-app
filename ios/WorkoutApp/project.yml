name: WorkoutApp
options:
  bundleIdPrefix: com.kellyneil
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  WorkoutEngine:
    path: ../Packages/WorkoutEngine
  WorkoutStore:
    path: ../Packages/WorkoutStore
  WorkoutUI:
    path: ../Packages/WorkoutUI
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  WorkoutApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: WorkoutEngine
      - package: WorkoutStore
      - package: WorkoutUI
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Workout
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        API_BASE_URL: $(API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kellyneil.workout
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        API_BASE_URL: https://exercise-app-api.fly.dev
      configs:
        Debug:
          API_BASE_URL: https://exercise-app-api.fly.dev
schemes:
  WorkoutApp:
    build:
      targets: { WorkoutApp: all }
    run:
      config: Debug
